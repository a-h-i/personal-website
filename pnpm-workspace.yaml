# pnpm reads these settings here; the package.json#pnpm field is no longer read.
overrides:
  '@types/react': 19.3.3
  '@types/react-dom': 19.3.0

# Every dependency shipping an install script needs an explicit true/false here, or
# `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS (strictDepBuilds defaults to true).
# Values must be real YAML booleans — a string counts as un-decided and still fails.
# The `false` entries ship prebuilt platform binaries, so their scripts are no-ops.
allowBuilds:
  core-js: true
  '@tailwindcss/oxide': false
  sharp: false
  unrs-resolver: false
