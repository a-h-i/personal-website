version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install "$(awk -F'"' '/^node =/ {print $2}' .prototools)"
        - corepack enable
        - corepack install
        - node --version
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
